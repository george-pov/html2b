identity:
  type: UserAssigned
  userAssignedIdentities:
    ? &renderId __RENDER_ID__
    : {}
properties:
  configuration:
    activeRevisionsMode: Single
    maxInactiveRevisions: 100
    identitySettings:
      - identity: *renderId
        lifecycle: None
    ingress:
      external: true
      allowInsecure: false
      targetPort: 8080
      transport: auto
      exposedPort: 0
      traffic:
        - latestRevision: true
          weight: 100
    registries:
      - server: __ACR_SERVER__
        identity: *renderId
  template:
    containers:
      - name: html2b-render
        image: __RENDER_IMAGE__
        resources:
          cpu: 1
          memory: 2Gi
        probes:
          - type: Liveness
            httpGet:
              path: /health/live
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          - type: Readiness
            httpGet:
              path: /health/ready
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          - type: Startup
            httpGet:
              path: /health/ready
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
            successThreshold: 1
    scale:
      minReplicas: 0
      maxReplicas: 1
      pollingInterval: 30
      cooldownPeriod: 300
      rules:
        - name: http-one-render
          http:
            metadata:
              concurrentRequests: '1'
    terminationGracePeriodSeconds: 30
