name: Html2B Azure deployment

on:
  push:
    branches:
      - main
    paths:
      - src/api/**
      - .dockerignore
      - scripts/github/Resolve-Html2bDeploymentSource.ps1
      - scripts/github/Publish-Html2bFunctions.ps1
      - scripts/github/Publish-Html2bRender.ps1
      - scripts/github/Update-Html2bRender.ps1
      - scripts/azure/Test-AzureDev.ps1
      - scripts/azure/Html2b.AzureDevValidation.psm1
      - scripts/azure/Html2b.AzureStateValidation.psm1
      - scripts/azure/Html2b.HttpValidation.psm1
      - scripts/azure/Html2b.OutputContracts.psm1
      - scripts/azure/Html2b.TelemetryEvidence.psm1
      - .github/workflows/daploy-azure.yml
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub Environment to deploy
        required: true
        default: dev
        type: environment

permissions: {}

jobs:
  deploy-application:
    name: Deploy application
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ github.event_name == 'push' && 'dev' || inputs.target_environment }}
    concurrency:
      group: html2b-azure-${{ github.event_name == 'push' && 'dev' || inputs.target_environment }}
      queue: max
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Check out deployment automation
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate main source
        shell: pwsh
        run: >-
          ./scripts/github/Resolve-Html2bDeploymentSource.ps1
          -RepositoryRoot $PWD
          -SourceSha $env:GITHUB_SHA
          -CurrentRef $env:GITHUB_REF

      - name: Block mixed application and Bicep changes
        if: ${{ github.event_name == 'push' }}
        shell: pwsh
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $applicationPaths = @(
              'src/api/**'
              '.dockerignore'
              'scripts/github/Resolve-Html2bDeploymentSource.ps1'
              'scripts/github/Publish-Html2bFunctions.ps1'
              'scripts/github/Publish-Html2bRender.ps1'
              'scripts/github/Update-Html2bRender.ps1'
              'scripts/azure/Test-AzureDev.ps1'
              'scripts/azure/Html2b.AzureDevValidation.psm1'
              'scripts/azure/Html2b.AzureStateValidation.psm1'
              'scripts/azure/Html2b.HttpValidation.psm1'
              'scripts/azure/Html2b.OutputContracts.psm1'
              'scripts/azure/Html2b.TelemetryEvidence.psm1'
              '.github/workflows/daploy-azure.yml'
          )

          git diff --quiet --no-renames `
              $env:PUSH_BEFORE_SHA `
              $env:GITHUB_SHA `
              -- `
              @applicationPaths
          $applicationClassificationExitCode = $LASTEXITCODE

          if ($applicationClassificationExitCode -eq 0) {
              throw (
                  'Automatic application deployment stopped because this push has no ' +
                  'approved application or pipeline input change.'
              )
          }

          if ($applicationClassificationExitCode -ne 1) {
              throw (
                  'Automatic application deployment could not classify application changes. ' +
                  "Git exited with code $applicationClassificationExitCode."
              )
          }

          git diff --quiet --no-renames `
              $env:PUSH_BEFORE_SHA `
              $env:GITHUB_SHA `
              -- `
              bicep/
          $bicepClassificationExitCode = $LASTEXITCODE

          if ($bicepClassificationExitCode -eq 1) {
              throw (
                  'Automatic application deployment stopped because this push also changes ' +
                  'bicep/. Run infrastructure What-If/Apply first, then manually dispatch ' +
                  "this application workflow for exact source $env:GITHUB_SHA."
              )
          }

          if ($bicepClassificationExitCode -ne 0) {
              throw (
                  'Automatic application deployment could not classify Bicep changes. ' +
                  "Git exited with code $bicepClassificationExitCode."
              )
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Publish Functions
        shell: pwsh
        run: >-
          ./scripts/github/Publish-Html2bFunctions.ps1
          -SourceRoot $PWD
          -OutputDirectory
          (Join-Path $PWD 'build/release/functions')

      - name: Install Application Insights CLI extension
        shell: pwsh
        run: >-
          az extension add
          --name application-insights
          --version 1.2.3
          --yes
          --only-show-errors

      - name: Log in to Azure
        uses: Azure/login@v3.0.0
        with:
          client-id: ${{ vars.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Publish Render image
        id: render-image
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CONTAINER_REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}
          AZURE_RENDER_IMAGE_REPOSITORY: ${{ vars.AZURE_RENDER_IMAGE_REPOSITORY }}
        run: >-
          ./scripts/github/Publish-Html2bRender.ps1
          -SourceRoot $PWD
          -SourceSha $env:GITHUB_SHA
          -SubscriptionId $env:AZURE_SUBSCRIPTION_ID
          -ExpectedTenantId $env:AZURE_TENANT_ID
          -RegistryName $env:AZURE_CONTAINER_REGISTRY_NAME
          -ImageRepository $env:AZURE_RENDER_IMAGE_REPOSITORY
          -GitHubOutputPath $env:GITHUB_OUTPUT

      - name: Update Render
        shell: pwsh
        env:
          RENDER_IMAGE: ${{ steps.render-image.outputs.image }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          AZURE_RENDER_CONTAINER_APP_NAME: ${{ vars.AZURE_RENDER_CONTAINER_APP_NAME }}
        run: >-
          ./scripts/github/Update-Html2bRender.ps1
          -SubscriptionId $env:AZURE_SUBSCRIPTION_ID
          -ResourceGroupName $env:AZURE_RESOURCE_GROUP_NAME
          -ContainerAppName $env:AZURE_RENDER_CONTAINER_APP_NAME
          -Image $env:RENDER_IMAGE

      - name: Deploy Functions
        uses: Azure/functions-action@v1.5.6
        env:
          AZURE_CORE_OUTPUT: json
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          package: build/release/functions
          remote-build: false

      - name: Validate deployment
        id: validation
        shell: pwsh
        env:
          TARGET_ENVIRONMENT: ${{ github.event_name == 'push' && 'dev' || inputs.target_environment }}
          RENDER_IMAGE: ${{ steps.render-image.outputs.image }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_RESOURCE_GROUP_NAME: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
          AZURE_RENDER_REGISTRY_SERVER: ${{ format('{0}.azurecr.io', vars.AZURE_CONTAINER_REGISTRY_NAME) }}
          AZURE_RENDER_IMAGE_REPOSITORY: ${{ vars.AZURE_RENDER_IMAGE_REPOSITORY }}
          AZURE_RENDER_CONTAINER_APP_NAME: ${{ vars.AZURE_RENDER_CONTAINER_APP_NAME }}
          AZURE_RENDER_IDENTITY_NAME: ${{ vars.AZURE_RENDER_IDENTITY_NAME }}
          AZURE_FUNCTION_APP_NAME: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          AZURE_APPLICATION_INSIGHTS_NAME: ${{ vars.AZURE_APPLICATION_INSIGHTS_NAME }}
          AZURE_RENDER_API_CLIENT_ID: ${{ vars.AZURE_RENDER_API_CLIENT_ID }}
          AZURE_FUNCTION_INSTANCE_MEMORY_MB: ${{ vars.AZURE_FUNCTION_INSTANCE_MEMORY_MB }}
          AZURE_FUNCTION_MAXIMUM_INSTANCE_COUNT: ${{ vars.AZURE_FUNCTION_MAXIMUM_INSTANCE_COUNT }}
          AZURE_RENDER_CPU: ${{ vars.AZURE_RENDER_CPU }}
          AZURE_RENDER_MEMORY: ${{ vars.AZURE_RENDER_MEMORY }}
          AZURE_RENDER_MIN_REPLICAS: ${{ vars.AZURE_RENDER_MIN_REPLICAS }}
          AZURE_RENDER_MAX_REPLICAS: ${{ vars.AZURE_RENDER_MAX_REPLICAS }}
          AZURE_RENDER_HTTP_CONCURRENCY: ${{ vars.AZURE_RENDER_HTTP_CONCURRENCY }}
        run: >-
          ./scripts/azure/Test-AzureDev.ps1
          -EnvironmentName $env:TARGET_ENVIRONMENT
          -SubscriptionId $env:AZURE_SUBSCRIPTION_ID
          -ExpectedTenantId $env:AZURE_TENANT_ID
          -ResourceGroupName $env:AZURE_RESOURCE_GROUP_NAME
          -FunctionAppName $env:AZURE_FUNCTION_APP_NAME
          -RenderContainerAppName $env:AZURE_RENDER_CONTAINER_APP_NAME
          -RenderApiClientId $env:AZURE_RENDER_API_CLIENT_ID
          -RenderRegistryServer $env:AZURE_RENDER_REGISTRY_SERVER
          -RenderImageRepository $env:AZURE_RENDER_IMAGE_REPOSITORY
          -RenderIdentityName $env:AZURE_RENDER_IDENTITY_NAME
          -ExpectedRenderImage $env:RENDER_IMAGE
          -ApplicationInsightsName $env:AZURE_APPLICATION_INSIGHTS_NAME
          -FunctionInstanceMemoryMB $env:AZURE_FUNCTION_INSTANCE_MEMORY_MB
          -FunctionMaximumInstanceCount $env:AZURE_FUNCTION_MAXIMUM_INSTANCE_COUNT
          -RenderCpu $env:AZURE_RENDER_CPU
          -RenderMemory $env:AZURE_RENDER_MEMORY
          -RenderMinReplicas $env:AZURE_RENDER_MIN_REPLICAS
          -RenderMaxReplicas $env:AZURE_RENDER_MAX_REPLICAS
          -RenderHttpConcurrency $env:AZURE_RENDER_HTTP_CONCURRENCY
          -OutputDirectory
          (Join-Path $PWD "build/validation/$($env:TARGET_ENVIRONMENT)/application")

      - name: Upload sanitized validation summary
        if: ${{ always() && steps.validation.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: html2b-azure-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/validation/${{ github.event_name == 'push' && 'dev' || inputs.target_environment }}/application/validation-summary.json
          if-no-files-found: error
          retention-days: 7
