name: Azure infrastructure deployment

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub Environment to deploy
        required: true
        default: dev
        type: environment
      deployment_mode:
        description: Preview or apply infrastructure
        required: true
        default: WhatIf
        type: choice
        options:
          - WhatIf
          - Apply
      render_image:
        description: Digest-qualified Render image for this infrastructure run
        required: true
        default: ''
        type: string

permissions: {}

jobs:
  deploy-infrastructure:
    name: Deploy infrastructure
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ inputs.target_environment }}
    concurrency:
      group: html2b-azure-${{ inputs.target_environment }}
      queue: max
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none

    steps:
      - name: Check out infrastructure source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Azure
        uses: Azure/login@v3.0.0
        with:
          client-id: ${{ vars.AZURE_INFRA_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Preview or apply infrastructure
        shell: pwsh
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          DEPLOYMENT_MODE: ${{ inputs.deployment_mode }}
          RENDER_IMAGE: ${{ inputs.render_image }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $parametersFile = ConvertFrom-Json @'
          ${{ toJSON(vars.AZURE_BICEP_PARAMETERS_FILE) }}
          '@

          if ([string]::IsNullOrWhiteSpace($parametersFile)) {
            throw 'The selected Environment has no Bicep parameters file.'
          }
          if (-not (Test-Path -LiteralPath $parametersFile -PathType Leaf)) {
            throw "Bicep parameters file was not found: $parametersFile"
          }
          if ($env:RENDER_IMAGE -notmatch '^[a-z0-9.-]+/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$') {
            throw 'Render image must be a lowercase digest-qualified image reference.'
          }

          $env:HTML2B_CONTAINER_IMAGE = $env:RENDER_IMAGE
          $parametersPath = Join-Path $env:RUNNER_TEMP 'html2b-parameters.json'
          az bicep build-params `
            --file $parametersFile `
            --outfile $parametersPath `
            --only-show-errors

          $parameters = Get-Content -LiteralPath $parametersPath -Raw |
            ConvertFrom-Json -Depth 100
          $location = [string] $parameters.parameters.location.value
          if ([string]::IsNullOrWhiteSpace($location)) {
            throw 'The compiled Bicep parameters contain no deployment location.'
          }

          $deploymentName = 'html2b-{0}-infra-{1}' -f `
            $env:TARGET_ENVIRONMENT, $env:GITHUB_RUN_ID
          $deploymentArguments = @(
            'deployment', 'sub', 'what-if',
            '--subscription', $env:AZURE_SUBSCRIPTION_ID,
            '--name', $deploymentName,
            '--location', $location,
            '--template-file', 'bicep/main.bicep',
            '--parameters', "@$parametersPath",
            '--no-prompt', 'true',
            '--only-show-errors',
            '--output', 'json',
            '--result-format', 'ResourceIdOnly',
            '--no-pretty-print'
          )
          $whatIf = (& az @deploymentArguments) | ConvertFrom-Json -Depth 100
          if (@($whatIf.changes | Where-Object { $_.changeType -ceq 'Delete' }).Count -ne 0) {
            throw 'Azure What-If contains a resource deletion; Apply is blocked.'
          }

          if ($env:DEPLOYMENT_MODE -ceq 'Apply') {
            $applyArguments = @(
              'deployment', 'sub', 'create',
              '--subscription', $env:AZURE_SUBSCRIPTION_ID,
              '--name', $deploymentName,
              '--location', $location,
              '--template-file', 'bicep/main.bicep',
              '--parameters', "@$parametersPath",
              '--no-prompt', 'true',
              '--only-show-errors',
              '--output', 'none'
            )
            $null = & az @applyArguments
          }
